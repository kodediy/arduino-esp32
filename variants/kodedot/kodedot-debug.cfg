# Kode Dot debug configuration, layered on top of board/esp32p4-builtin.cfg.
#
# A sketch runs in place from kodeOS's apps region, an address OpenOCD's flash probe cannot
# describe ("Failed to get flash maps"): the memory map is off, GDB trusts the ELF, and every
# breakpoint is a hardware one (three triggers per core, shared with watchpoints).
# The stock gdb-attach handler in target/esp_common.cfg resets the chip on some attaches; this
# one only halts, so the one reset is the attach command list's, after kodedot_arm has read what
# was running.
# Nothing resumes a halted hart when the debugger leaves, and OpenOCD's shutdown then disables
# the debug module with the hart halted, so both exits resume it explicitly. The shutdown hook
# is wrapped in catch (the list is walked with eval, no error handling) and goes first, ahead of
# the entry that turns the debug module off; the detach callbacks run again after the shutdown
# commands, so the resume has to be safe to reach twice.

gdb memory_map disable
gdb breakpoint_override hard

# Attach by halting, never by resetting
esp32p4.hp.cpu0 configure -event gdb-attach {
    if {[catch {halt 1000} msg opts]} {
        if {[esp32p4.hp.cpu0 curstate] != "halted"} { return -options $opts $msg }
    }
    esp32p4.hp.cpu0 riscv set_maskisr steponly
    esp32p4.hp.cpu1 riscv set_maskisr steponly
}

# Leave the sketch running when the debugger goes away
proc kodedot_resume_if_halted {} {
    if {[esp32p4.hp.cpu0 curstate] == "halted"} { resume }
}
esp32p4.hp.cpu0 configure -event gdb-detach { kodedot_resume_if_halted }
set ::pre_shutdown_commands [linsert $::pre_shutdown_commands 0 { catch { kodedot_resume_if_halted } }]

# ---------------------------------------------------------------------------
# Arming the sketch from the debugger.
#
# Start Debugging never uploads, and the bootloader only boots the sketch while a boot request
# stands, which Upload is what arms. So the attach list calls kodedot_arm first: it compares the
# app descriptor the chip is running (256 bytes at the ELF's esp_app_desc) with the one in the
# .bin about to be debugged and, when they differ, writes the .bin into kodeOS's app_pending
# mailbox with esptool over the serial port, exactly as Upload does, then waits for kodeOS to
# adopt and launch it. Never through OpenOCD's own flash writer: the stub in the core's
# openocd-esp32 build addresses erase and write with 24 bits, so a write aimed at 0x1C00000
# lands 16 MB lower, at 0xC00000: the end of ota_1, then coredump and the apps directory.
#
# The board entry passes what the upload needs as -c arguments (cortex-debug's serverArgs):
#     ::kodedot_esptool ::kodedot_port ::kodedot_bin ::kodedot_esptool_args
#     ::kodedot_flash_args (the upload's write-flash settings and address, {build.flash_offset})
# and GDB calls
#     eval "monitor kodedot_arm 0x%x", &esp_app_desc
#
# With more than one Kode Dot plugged in, OpenOCD takes the first USB-JTAG it finds, whichever
# board the serial port belongs to: the upload would then land on one Dot while the debugger
# waits on another. kodedot_arm compares the two boards' MACs - the eFuse one OpenOCD reads over
# JTAG and the one esptool reports for the port - and stops on a mismatch. Nothing is fixed
# here: both are read from whatever is connected.
# ---------------------------------------------------------------------------

# app descriptor offset and size inside an application image
set ::kodedot_desc_off 0x20
set ::kodedot_desc_len 256
# head start for esptool and the boot, poll interval, overall budget
set ::kodedot_arm_head_ms 8000
set ::kodedot_arm_poll_ms 2000
set ::kodedot_arm_timeout_ms 90000
# EFUSE_RD_MAC_SYS_0/1 (DR_REG_EFUSE_BASE 0x5012D000 + 0x44, 0x48), readable while the hart runs
set ::kodedot_efuse_mac 0x5012D044

# the MAC of the chip OpenOCD is attached to, as aa:bb:cc:dd:ee:ff, or "" if it cannot be read
proc kodedot_jtag_mac {} {
    if {[catch {set w [read_memory $::kodedot_efuse_mac 32 2]}]} { return "" }
    set lo [lindex $w 0]
    set hi [lindex $w 1]
    return [format "%02x:%02x:%02x:%02x:%02x:%02x" \
        [expr {($hi >> 8) & 0xFF}] [expr {$hi & 0xFF}] [expr {($lo >> 24) & 0xFF}] \
        [expr {($lo >> 16) & 0xFF}] [expr {($lo >> 8) & 0xFF}] [expr {$lo & 0xFF}]]
}

# the first "MAC: aa:bb:cc:dd:ee:ff" in esptool's output, lower case, or ""
proc kodedot_mac_in {text} {
    if {[regexp {MAC:[ \t]+([0-9A-Fa-f:]{17})} $text -> mac]} { return [string tolower $mac] }
    return ""
}

# stop unless OpenOCD and the serial port are on the same Dot; a MAC that could not be read
# skips the check with a note rather than blocking a session that may be fine
proc kodedot_same_dot {jtag_mac port port_mac} {
    if {$jtag_mac eq "" || $port_mac eq ""} {
        echo "Kode Dot: could not read both MACs; not checking that OpenOCD is on the Dot at $port"
        return
    }
    if {$jtag_mac ne $port_mac} {
        error "Kode Dot: OpenOCD is attached to the Dot [string toupper $jtag_mac], but $port belongs to the Dot [string toupper $port_mac]. With more than one Kode Dot plugged in, OpenOCD takes the first one it finds: unplug the others, then Start Debugging again"
    }
    echo "Kode Dot: OpenOCD and $port are the same Dot ([string toupper $jtag_mac])"
}

# the app descriptor inside an image file, as a list of 32-bit words
proc kodedot_desc_in_file {bin} {
    set f [open $bin rb]
    seek $f $::kodedot_desc_off
    set data [read $f $::kodedot_desc_len]
    close $f
    if {[string length $data] != $::kodedot_desc_len} {
        error "Kode Dot: $bin is too short to be an application image"
    }
    # no "binary" command in OpenOCD's Jim Tcl: assemble little-endian words by hand
    set words {}
    for {set i 0} {$i < $::kodedot_desc_len} {incr i 4} {
        set w 0
        for {set j 3} {$j >= 0} {incr j -1} {
            set w [expr {($w << 8) | [scan [string index $data [expr {$i + $j}]] %c]}]
        }
        lappend words $w
    }
    if {[lindex $words 0] != 0xabcd5432} {
        error "Kode Dot: $bin does not carry an app descriptor at offset $::kodedot_desc_off"
    }
    return $words
}

# the app descriptor the chip is running (read with the hart halted), or an empty list
proc kodedot_desc_on_chip {addr} {
    set words {}
    set was_running [expr {[esp32p4.hp.cpu0 curstate] == "running"}]
    if {$was_running} { catch { halt 1000 } }
    catch { set words [read_memory $addr 32 [expr {$::kodedot_desc_len / 4}]] }
    if {$was_running} { catch { resume } }
    return $words
}

# do the two descriptors describe the same build?
proc kodedot_same_build {a b} {
    if {[llength $a] != [llength $b]} { return 0 }
    foreach x $a y $b {
        if {[expr {$x & 0xFFFFFFFF}] != [expr {$y & 0xFFFFFFFF}]} { return 0 }
    }
    return 1
}

proc kodedot_arm {desc_addr} {
    set want [kodedot_desc_in_file $::kodedot_bin]
    # the IDE does not fill {debug.port} in (arduino-cli does): fall back to the Dot's USB identity
    set port $::kodedot_port
    if {$port eq "" || [string first "\{" $port] >= 0} {
        set port "hwgrep://303A:1001"
    }
    set jtag_mac [kodedot_jtag_mac]
    if {[kodedot_same_build [kodedot_desc_on_chip $desc_addr] $want]} {
        # the build matches, but on the Dot OpenOCD is on: ask the port which Dot it is. A busy
        # port (a Serial Monitor left open) only skips the check, as it never blocked this path
        catch { halt 1000 }
        set cmd [list $::kodedot_esptool {*}$::kodedot_esptool_args --port $port \
            --before default-reset --after hard-reset read-mac]
        if {[catch {exec {*}$cmd 2>@1} out]} {
            echo "Kode Dot: could not read the Dot at $port; not checking that OpenOCD is on it"
        } else {
            kodedot_same_dot $jtag_mac $port [kodedot_mac_in $out]
        }
        echo "Kode Dot: this build is running and armed; nothing to upload"
        return
    }
    echo "Kode Dot: the chip is not running this build; uploading it through $port so kodeOS installs and launches it"
    # halt first: a sketch printing to Serial floods the CDC interface and esptool reads its bytes
    # instead of the ROM's greeting ("Invalid head of packet"); a halted CPU emits nothing
    catch { halt 1000 }
    set cmd [list $::kodedot_esptool {*}$::kodedot_esptool_args --port $port \
        --before default-reset --after hard-reset write-flash {*}$::kodedot_flash_args $::kodedot_bin]
    if {[catch {exec {*}$cmd 2>@1} out]} {
        error "Kode Dot: the upload failed - if the Serial Monitor is open, close it, then Start Debugging again. esptool said:\n[string range $out end-1500 end]"
    }
    # esptool printed the port's MAC on the way: stop now rather than wait on the wrong Dot
    kodedot_same_dot $jtag_mac $port [kodedot_mac_in $out]
    echo "Kode Dot: uploaded; waiting for kodeOS to adopt and launch the sketch"
    set t0 [clock milliseconds]
    sleep $::kodedot_arm_head_ms
    while {1} {
        set elapsed [expr {([clock milliseconds] - $t0) / 1000}]
        if {[kodedot_same_build [kodedot_desc_on_chip $desc_addr] $want]} {
            echo "Kode Dot: the sketch is up and armed after $elapsed s; restarting it under the debugger"
            return
        }
        if {[clock milliseconds] - $t0 >= $::kodedot_arm_timeout_ms} { break }
        echo "Kode Dot: still waiting for kodeOS ($elapsed s)"
        sleep $::kodedot_arm_poll_ms
    }
    error "Kode Dot: the sketch did not come up within [expr {$::kodedot_arm_timeout_ms / 1000}] s; check the board's screen, then Start Debugging again"
}
